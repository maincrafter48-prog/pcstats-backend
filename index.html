<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PC Stats — список серверов</title>
<style>
  :root{
    --bg-0:#0a0910;
    --bg-1:#121020;
    --bg-2:#181530;
    --panel:#151228;
    --line: rgba(255,255,255,0.08);
    --violet: #8b6bff;
    --green: #33e08a;
    --gold: #f2c94c;
    --red: #ff5c5c;
    --text-hi:#f2f0fb;
    --text-mid:#a9a3c9;
    --text-low:#6c6790;
    --mono: 'JetBrains Mono', 'Consolas', monospace;
    --disp: 'Rajdhani', 'Oswald', sans-serif;
    --body: 'Inter', 'Segoe UI', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at 20% -10%, rgba(139,107,255,0.16), transparent 55%),
      radial-gradient(ellipse at 100% 0%, rgba(51,224,138,0.08), transparent 45%),
      var(--bg-0);
    color:var(--text-hi);
    font-family:var(--body);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none;}
  ::selection{background:var(--violet);color:#fff;}

  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 28px;border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:50;
    background:rgba(10,9,16,0.82);backdrop-filter:blur(10px);
  }
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--disp);font-weight:700;letter-spacing:0.04em;font-size:19px;cursor:pointer;}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);}
  .brand .dot.off{background:var(--red);box-shadow:0 0 10px var(--red);}
  .brand small{font-family:var(--mono);color:var(--text-low);font-weight:500;font-size:12px;letter-spacing:0.08em;margin-left:6px;}
  .topbar .updated{font-family:var(--mono);font-size:12px;color:var(--text-low);}

  .wrap{max-width:900px;margin:0 auto;padding:36px 24px 90px;}

  .hero{margin-bottom:28px;}
  .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:0.18em;text-transform:uppercase;color:var(--green);margin-bottom:10px;}
  h1{font-family:var(--disp);font-size:34px;line-height:1.05;font-weight:700;margin:0 0 8px;letter-spacing:0.01em;}
  .sub{color:var(--text-mid);font-size:14.5px;max-width:560px;line-height:1.55;}

  /* ---------- server list ---------- */
  .server-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:8px;}
  .server-card{
    background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;
    cursor:pointer;transition:border-color .15s,transform .15s;
  }
  .server-card:hover{border-color:var(--violet);transform:translateY(-2px);}
  .server-name{font-family:var(--disp);font-weight:700;font-size:17px;margin-bottom:6px;}
  .server-count{font-family:var(--mono);font-size:12px;color:var(--text-low);}
  .server-count b{color:var(--green);}

  /* ---------- tabs ---------- */
  .tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:22px;}
  .tab{
    font-family:var(--disp);font-size:15px;font-weight:600;letter-spacing:0.02em;
    padding:11px 18px;color:var(--text-low);cursor:pointer;border-bottom:2px solid transparent;
    transition:color .15s;
  }
  .tab.active{color:var(--text-hi);border-color:var(--violet);}
  .tab:hover{color:var(--text-hi);}
  .back{font-family:var(--mono);font-size:12.5px;color:var(--text-low);cursor:pointer;margin-bottom:16px;display:inline-block;}
  .back:hover{color:var(--text-hi);}

  /* ---------- currency tab ---------- */
  .rate-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;}
  .rate-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;}
  .rate-top{display:flex;justify-content:space-between;align-items:center;}
  .rate-sym{font-family:var(--disp);font-weight:700;font-size:18px;}
  .rate-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;}
  .rate-val{font-family:var(--mono);font-size:24px;font-weight:700;margin-top:14px;color:var(--text-hi);}
  .rate-ago{font-family:var(--mono);font-size:11px;color:var(--text-low);margin-top:12px;padding-top:12px;border-top:1px solid var(--line);}
  .rate-ago.fresh{color:var(--green);}
  .rate-ago.stale{color:var(--red);}

  /* ---------- player tab ---------- */
  .player-list{display:flex;flex-direction:column;gap:8px;}
  .player-row{
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:13px 16px;display:flex;align-items:center;justify-content:space-between;
  }
  .player-nick{font-family:var(--mono);font-weight:700;font-size:14.5px;}
  .player-ago{font-family:var(--mono);font-size:11.5px;color:var(--text-low);}
  .player-ago.fresh{color:var(--green);}

  .empty-note{
    font-family:var(--mono);font-size:12px;color:var(--text-low);text-align:center;
    padding:22px;border:1px dashed var(--line);border-radius:12px;margin-top:16px;line-height:1.7;
  }

  .screen{display:none;}
  .screen.active{display:block;}

  @media (max-width:640px){
    h1{font-size:27px;}
    .wrap{padding:24px 16px 70px;}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand" onclick="goHome()"><span class="dot" id="statusDot"></span>PC STATS<small>LIVE</small></div>
  <div class="updated" id="updatedAt"></div>
</div>

<div class="wrap">

  <!-- SCREEN 0: список серверов -->
  <div class="screen active" id="screen-home">
    <div class="hero">
      <div class="eyebrow">PC Stats · сеть серверов</div>
      <h1>Кто сейчас в сети</h1>
      <div class="sub">Список серверов, где хотя бы один игрок пользуется PC Stats. Выбери сервер, чтобы увидеть игроков и актуальный курс валют.</div>
    </div>
    <div class="server-grid" id="serverGrid"></div>
    <div id="homeEmpty"></div>
  </div>

  <!-- SCREEN 1: dashboard сервера -->
  <div class="screen" id="screen-dash">
    <span class="back" onclick="goHome()">← ко всем серверам</span>
    <div class="hero">
      <div class="eyebrow" id="dashEyebrow">Сервер</div>
      <h1 id="dashTitle">—</h1>
    </div>

    <div class="tabs">
      <div class="tab active" data-tab="rates" onclick="switchTab('rates')">Валюты</div>
      <div class="tab" data-tab="player" onclick="switchTab('player')">Игроки</div>
    </div>

    <div id="tab-rates"></div>
    <div id="tab-player" style="display:none;"></div>
  </div>

</div>

<script>
/* Адрес бэкенда (см. worker.js — деплоится на Cloudflare Workers за
   5 минут, бесплатно). Поменяй на свой адрес после деплоя. */
const API_BASE = "https://spring-frost-ab03.maincrafter48.workers.dev";

let currentServer = null;
let pollTimer = null;

function money(n){ return Math.round(n||0).toLocaleString('ru-RU'); }

function agoText(ts){
  if(!ts) return {text:'нет данных', cls:'stale'};
  const diffMin = Math.floor((Date.now() - ts) / 60000);
  if(diffMin < 1) return {text:'обновлено только что', cls:'fresh'};
  if(diffMin < 60) return {text:'обновлено ' + diffMin + ' мин. назад', cls: diffMin < 15 ? 'fresh' : ''};
  const diffH = Math.floor(diffMin/60);
  if(diffH < 24) return {text:'обновлено ' + diffH + ' ч. назад', cls:'stale'};
  return {text:'обновлено ' + Math.floor(diffH/24) + ' дн. назад', cls:'stale'};
}

async function loadServers(){
  try{
    const res = await fetch(API_BASE.replace(/\/+$/,'') + '/servers');
    const data = await res.json();
    document.getElementById('statusDot').classList.remove('off');
    const grid = document.getElementById('serverGrid');
    const servers = data.servers || [];
    if(servers.length === 0){
      document.getElementById('homeEmpty').innerHTML = '<div class="empty-note">Пока ни один сервер не появился. Как только кто-то зайдёт в игру со скриптом PC Stats — сервер появится здесь автоматически.</div>';
      grid.innerHTML = '';
      return;
    }
    document.getElementById('homeEmpty').innerHTML = '';
    grid.innerHTML = servers.map(s => `
      <div class="server-card" onclick="openServer('${escapeHtml(s)}')">
        <div class="server-name">${escapeHtml(s)}</div>
        <div class="server-count">нажми, чтобы открыть →</div>
      </div>`).join('');
  }catch(e){
    document.getElementById('statusDot').classList.add('off');
  }
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function switchTab(tab){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===tab));
  document.getElementById('tab-rates').style.display  = tab==='rates'  ? '' : 'none';
  document.getElementById('tab-player').style.display = tab==='player' ? '' : 'none';
}

function renderRates(rates){
  const el = document.getElementById('tab-rates');
  if(!rates){
    el.innerHTML = '<div class="empty-note">Курс валют ещё не приходил с этого сервера. Как только кто-то нажмёт «Обновить с телефона» в скрипте — курс появится здесь.</div>';
    return;
  }
  const ago = agoText(rates.updated);
  const items = [
    {label:'AZ-Coin', icon:'🪙', color:'#f2c94c', val:rates.az},
    {label:'BTC',      icon:'₿',  color:'#f2994a', val:rates.btc},
    {label:'Евро',     icon:'€',  color:'#56ccf2', val:rates.eur},
    {label:'VC$ (покупка)', icon:'💵', color:'#33e08a', val:rates.vc},
    {label:'VC$ (продажа)', icon:'💵', color:'#33e08a', val:rates.vcSell},
    {label:'ASC',      icon:'🎟️', color:'#bb6bff', val:rates.asc},
  ].filter(c => c.val && c.val > 0);
  if(items.length === 0){
    el.innerHTML = '<div class="empty-note">Курс валют ещё не приходил с этого сервера.</div>';
    return;
  }
  el.innerHTML = '<div class="rate-grid">' + items.map(c => `
      <div class="rate-card">
        <div class="rate-top">
          <div class="rate-sym">${c.label}</div>
          <div class="rate-icon" style="background:${c.color}22;color:${c.color}">${c.icon}</div>
        </div>
        <div class="rate-val">${money(c.val)} SA$</div>
        <div class="rate-ago ${ago.cls}">${ago.text}</div>
      </div>`).join('') + '</div>';
}

function renderPlayers(players){
  const el = document.getElementById('tab-player');
  if(!players || players.length === 0){
    el.innerHTML = '<div class="empty-note">Пока никто не заходил на этот сервер со скриптом PC Stats.</div>';
    return;
  }
  el.innerHTML = '<div class="player-list">' + players.map(p => {
    const ago = agoText(p.updated);
    return `<div class="player-row">
      <div class="player-nick">${escapeHtml(p.nick)}</div>
      <div class="player-ago ${ago.cls}">${ago.text}</div>
    </div>`;
  }).join('') + '</div>';
}

async function refreshDash(){
  if(!currentServer) return;
  try{
    const res = await fetch(API_BASE.replace(/\/+$/,'') + '/data?server=' + encodeURIComponent(currentServer));
    const data = await res.json();
    document.getElementById('statusDot').classList.remove('off');
    document.getElementById('updatedAt').textContent = 'обновлено ' + new Date().toLocaleTimeString('ru-RU');
    renderRates(data.rates);
    renderPlayers(data.players);
  }catch(e){
    document.getElementById('statusDot').classList.add('off');
  }
}

function openServer(name){
  currentServer = name;
  document.getElementById('screen-home').classList.remove('active');
  document.getElementById('screen-dash').classList.add('active');
  document.getElementById('dashTitle').textContent = name;
  switchTab('rates');
  refreshDash();
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(refreshDash, 15000);
  location.hash = 'server=' + encodeURIComponent(name);
}

function goHome(){
  currentServer = null;
  if(pollTimer) clearInterval(pollTimer);
  document.getElementById('screen-dash').classList.remove('active');
  document.getElementById('screen-home').classList.add('active');
  location.hash = '';
  loadServers();
}

function boot(){
  const m = location.hash.match(/server=([^&]+)/);
  loadServers();
  if(m) openServer(decodeURIComponent(m[1]));
}

window.addEventListener('hashchange', () => { if(!location.hash) goHome(); });
boot();
</script>
</body>
</html>
